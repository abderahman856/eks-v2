services:
  postgres:
    image: postgres:16.9-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce

  localstack:
    image: localstack/localstack:3.8
    container_name: localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    networks:
      - ecommerce

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      AUTH_ENABLED: false
      ORDER_SERVICE_URL: http://order-service:8084
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      SHIPPING_SERVICE_URL: http://shipping-service:8087
      DASHBOARD_SERVICE_URL: http://dashboard-api:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce

  dashboard-api:
    build: ./services/dashboard-api
    container_name: dashboard-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ORDER_SERVICE_URL: http://order-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      INVENTORY_SERVICE_URL: http://inventory-service:8082
    depends_on:
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - ecommerce

  inventory-service:
    build: ./services/inventory-service
    container_name: inventory-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: ${INVENTORY_DB_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: ${NOTIFICATION_DB_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce

  order-service:
    build: ./services/order-service
    container_name: order-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      DATABASE_URL: ${ORDER_DB_URL}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - ecommerce

  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: ${PAYMENT_DB_URL}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - ecommerce

  scheduler:
    build: ./services/scheduler
    container_name: scheduler
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      ORDER_SERVICE_URL: http://order-service:8084
      INVENTORY_SERVICE_URL: http://inventory-service:8082
    depends_on:
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
    networks:
      - ecommerce

  shipping-service:
    build: ./services/shipping-service
    container_name: shipping-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      DATABASE_URL: ${SHIPPING_DB_URL}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - ecommerce

  worker:
    build: ./services/worker
    container_name: worker
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      ORDER_SERVICE_URL: http://order-service:8084
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      SHIPPING_SERVICE_URL: http://shipping-service:8087
    depends_on:
      localstack:
        condition: service_started
    networks:
      - ecommerce

  customer-storefront:
    build:
      context: ./customer-storefront
      args:
        REACT_APP_API_GATEWAY_URL: ${REACT_APP_API_GATEWAY_URL:-http://localhost:8080}
    container_name: customer-storefront
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_GATEWAY_URL: ${REACT_APP_API_GATEWAY_URL:-http://localhost:8080}
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - ecommerce

volumes:
  postgres-data:

networks:
  ecommerce:
    driver: bridge